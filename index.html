<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Track daily habits, goals and streaks with Streak Tracker Pro - featuring real scheduled background push reminders">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StreakTracker">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">

<title>Streak Tracker Pro</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- ================= HEADER ================= -->
    <header>
        <div>
            <h1>🔥 Streak Tracker Pro</h1>
            <p class="subtitle">Build consistency one day at a time</p>
        </div>

        <div class="header-actions">
            <button id="notifStatusBtn" class="notif-btn" title="Toggle background reminders">🔔 Enable Notifications</button>
            <button id="testPushBtn" class="test-push-btn" title="Send a test notification to verify delivery">🧪 Test Push</button>
            <button id="themeBtn">🌙 Dark Mode</button>
        </div>
    </header>

    <!-- ================= NOTIFICATION BANNER ================= -->
    <div id="notifBanner" class="notif-banner" style="display: none;"></div>

    <!-- ================= SEARCH ================= -->
    <section class="search-section">
        <input id="searchTask" placeholder="🔍 Search goals, categories..." />
    </section>

    <!-- ================= DASHBOARD ================= -->
    <section class="dashboard">
        <div class="card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
        </div>

        <div class="card">
            <h3>Completed Today</h3>
            <p id="completedToday">0</p>
        </div>

        <div class="card">
            <h3>Longest Streak</h3>
            <p id="longestStreak">0</p>
        </div>
    </section>

    <!-- ================= ADD SECTION ================= -->
    <section class="add-section">

        <h2>Add New Goal</h2>

        <div class="add">

            <input id="title" placeholder="Task Name (e.g. Study DSA)" />

            <select id="category">
                <option value="">Select Category</option>
                <option>Study</option>
                <option>Fitness</option>
                <option>Health</option>
                <option>Reading</option>
                <option>Coding</option>
                <option>Meditation</option>
                <option>Work</option>
                <option>Personal Development</option>
                <option>Finance</option>
                <option>Hobby</option>
                <option>Language Learning</option>
                <option>Other</option>
            </select>

            <select id="priority">
                <option value="">Select Priority</option>
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
            </select>

            <select id="goalType">
                <option value="target">🎯 Target Goal</option>
                <option value="unlimited">♾ Unlimited Goal</option>
            </select>

            <input
                id="targetDays"
                type="number"
                min="1"
                placeholder="Target Days (e.g. 30)"
            />

            <!-- Reminder settings in Add form -->
            <div class="reminder-form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="enableReminder">
                    <span>🔔 Enable Daily Reminder</span>
                </label>

                <div id="reminderTimeGroup" class="reminder-time-group" style="display: none;">
                    <label for="reminderTime">Time:</label>
                    <input type="time" id="reminderTime" value="19:00" />
                    <span id="detectedTz" class="tz-tag"></span>
                </div>
            </div>

            <button id="addBtn">Add Task</button>

        </div>

    </section>

    <!-- ================= BACKUP ================= -->
    <section class="backup-section">

        <h2>Backup & Restore</h2>

        <div class="backup-actions">
            <button id="exportBtn">📤 Export Backup</button>
            <label for="importFile" class="file-label">📥 Import Backup</label>
            <input type="file" id="importFile" accept=".json" style="display: none;" />
        </div>

    </section>

    <!-- ================= TASKS ================= -->
    <section class="tasks-section">

        <h2>Your Goals</h2>

        <div id="tasks"></div>

        <div id="emptyState">
            <h3>No Goals Yet</h3>
            <p>Add your first goal and start building your streak.</p>
        </div>

    </section>

    <!-- ================= FOOTER ================= -->
    <footer>
        <p>© 2026 Built with ❤️ by Mundru Meghana • PWA & Background Push Enabled</p>
    </footer>

</div>

<script src="js/script.js"></script>

</body>
</html>
